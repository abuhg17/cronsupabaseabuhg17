name: Hourly Supabase Table Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external-sync]
  schedule:
    # Primary + backup slot in case one is delayed/skipped by GitHub
    - cron: "37 * * * *"
    - cron: "57 * * * *"

permissions:
  contents: write

concurrency:
  group: supabase-table-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show trigger source
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Odd hour (Asia/Taipei): insert marker routine; even hour: remove it.
      # Runs before export so data/routine.json reflects the latest state.
      - name: Toggle cron routine (odd insert / even delete)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROUTINE_TZ: Asia/Taipei
        run: node scripts/toggle-cron-routine.mjs

      - name: Sync Supabase tables as JSON
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLES: ${{ secrets.SUPABASE_TABLES }}
          SYNC_CONCURRENCY: "4"
        run: node scripts/sync-supabase-tables.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          table_count=$(node -e "const m=require('./data/_manifest.json'); process.stdout.write(String(m.table_count??0))")
          git commit -m "chore: sync supabase tables (${table_count} tables)"
          git push
